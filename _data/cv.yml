projects:
  - title: Installation report review
    tag: Internal tool
    featured: true
    description: >-
      A review console for field installation reports. It polls Airtable for
      new tasks, pulls technician data from XOi Vision, and shows reviewers the
      QA questions and supporting evidence in one screen. Junior and senior
      reviewer roles, live updates over WebSocket, and results written back to
      Airtable.
    stack: [Python, Flask, Bootstrap, Airtable, WebSocket]

  - title: Field reports to PostgreSQL
    tag: Data pipeline
    description: >-
      A scheduled ETL that pulls field reports from a reporting API, flattens
      their nested XML into relational tables, and loads them into PostgreSQL.
      It creates tables and adds columns on the fly, skips records already
      loaded, and runs daily from a Docker container with cron.
    stack: [Python, XML, PostgreSQL, Docker, cron]

  - title: Rooftop asset detection
    tag: Computer vision
    description: >-
      A custom model that scans aerial imagery for items of interest on
      rooftops, giving a client a new pipeline of sales prospects.
    stack: [Python, PyTorch, AWS EC2, Docker]

  - title: Zapier integrations
    tag: Automation
    description: >-
      Connected corporate email, Spiro, HubSpot, Dropbox and JotForm into
      automated workflows, with error handling and rollback of changes made by
      unauthorized users.
    stack: [Zapier, HubSpot, Dropbox, JotForm]

  - title: Zoho Analytics dashboards
    tag: Analytics
    description: >-
      Dashboards and reports built on SQL queries that restructure raw client
      data into the metrics decision-makers need: bar charts, pivot tables,
      maps and Sankey diagrams.
    stack: [Zoho Analytics, SQL]

  - title: Shopping List
    tag: Side project
    description: >-
      A mobile and desktop app for keeping track of groceries, built entirely
      in Rust with Dioxus. My entry point into mobile development and the
      framework.
    stack: [Rust, Dioxus, SQLite, Tailwind CSS]
    link: https://github.com/jjvn84/shopping_list

