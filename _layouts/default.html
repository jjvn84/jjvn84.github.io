<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juan Vásquez",
        "jobTitle": "Backend Software Developer",
        "url": {{ '/' | absolute_url | jsonify }},
        "email": "mailto:jjvn84@gmail.com",
        "sameAs": [
          "https://github.com/jjvn84",
          "https://www.linkedin.com/in/juan-j-vasquez/"
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-head">
      <div class="wrap site-head__inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__mark" aria-hidden="true">JV</span>
          <span class="brand__name">Juan Vásquez</span>
        </a>

        <nav class="nav" aria-label="Main">
          <a href="#projects">Projects</a>
          <a href="#skills">Skills</a>
          <a href="#experience">Experience</a>
          <a href="#contact">Contact</a>
          <a class="btn btn--primary btn--sm" href="{{ '/assets/juan-vasquez-cv.pdf' | relative_url }}" download>CV</a>
        </nav>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-foot">
      <div class="wrap site-foot__inner">
        <p>&copy; {{ site.time | date: "%Y" }} Juan Vásquez</p>
        <p>Built with Jekyll &middot; Hosted on GitHub Pages</p>
      </div>
    </footer>

    <script>
      (function () {
        var head = document.querySelector('.site-head');
        var onScroll = function () {
          head.classList.toggle('is-scrolled', window.scrollY > 8);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });

        if (!('IntersectionObserver' in window)) return;

        document.documentElement.classList.add('js');

        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll('[data-reveal]').forEach(function (el) {
          observer.observe(el);
        });
      })();
    </script>
  </body>
</html>
